<html lang="en">
<head>

<title>Simha prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600&family=Nunito:wght@400;500;600;700&family=Fraunces:wght@500&family=DM+Sans:wght@400;500;600&family=Noto+Sans+Devanagari:wght@400;500;600&family=Noto+Sans+Telugu:wght@400;500;600&family=Noto+Sans+Kannada:wght@400;500;600&family=Noto+Sans+Tamil:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{background:#E9E4DB;font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;gap:18px;padding:20px 0 40px;min-height:100vh}
.themes{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;padding:0 12px}
.themes button,.jump select{font:500 15px system-ui,sans-serif;padding:10px 16px;border-radius:999px;border:1px solid #bdb4a6;background:#fff;color:#2b2b2b;cursor:pointer}
.themes button[aria-pressed=true]{background:#222;color:#fff;border-color:#222}
.phone{--shadow:0 2px 0 rgba(0,0,0,.1),0 6px 14px color-mix(in srgb,var(--primary) 26%,transparent);position:relative;width:360px;height:780px;overflow:hidden;border-radius:32px;box-shadow:0 0 0 10px #1d1d1f,0 24px 50px rgba(0,0,0,.3);background:var(--bg);color:var(--text);font-family:var(--font);font-size:20px;line-height:1.45;display:flex;flex-direction:column}
[data-theme=D]{--bg:#FFFFFF;--surface:#FFFFFF;--fill:#FDE9CF;--border:#EADFD2;--text:#1F1A17;--text2:#5C524A;--primary:#B23C0A;--onp:#FFFFFF;--accent:#F2A541;--success:#2F6B4F;--emerg:#A51D1D;--r:16px;--font:"Lexend","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Tamil",sans-serif;--fh:var(--font)}
[data-theme=E]{--bg:#FBF0EE;--surface:#FFFFFF;--fill:#F6E3DF;--border:#EBD5D1;--text:#2B1D1F;--text2:#634B4E;--primary:#7E2F3B;--onp:#FFFFFF;--accent:#E2B26A;--success:#2F6B4F;--emerg:#B3261E;--r:22px;--font:"Nunito","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Tamil",sans-serif;--fh:var(--font)}
[data-theme=F]{--bg:#F1F2F8;--surface:#FFFFFF;--fill:#E5E8F5;--border:#D9DCEB;--text:#1B1F33;--text2:#4B5070;--primary:#2E3A87;--onp:#FFFFFF;--accent:#D9A441;--success:#2F6B4F;--emerg:#B3261E;--r:14px;--font:"DM Sans","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Tamil",sans-serif;--fh:"Fraunces","Noto Sans Devanagari","Noto Sans Telugu","Noto Sans Kannada","Noto Sans Tamil",serif}
.top{height:64px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 8px}
.top.off{display:none}
.back{width:56px;height:56px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform 120ms}
.back:active{transform:scale(.97)}
.dots{display:flex;gap:6px;align-items:center}
.dots i{width:10px;height:10px;border-radius:5px;background:var(--border);transition:all 200ms}
.dots i.d{background:var(--primary);opacity:.45}
.dots i.c{background:var(--primary);width:24px}
.spacer{width:56px}
.stage{flex:1;position:relative}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex;animation:in 200ms ease-out}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.body{flex:1;overflow:auto;padding:4px 16px 16px;display:flex;flex-direction:column;gap:12px}
.foot{flex:none;padding:12px 16px 20px;display:grid;gap:12px}
h1{font:500 28px/1.3 var(--fh)}
h2{font:500 22px/1.3 var(--fh);margin-top:8px}
.lead{color:var(--text2)}
.cap{font-size:16px;color:var(--text2);line-height:1.4}
b{font-weight:500}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:64px;padding:8px 16px;border-radius:var(--r);border:1px solid transparent;font:500 22px/1.25 var(--font);cursor:pointer;transition:transform 120ms}
.btn:active,.card:active,.opt:active,.chip:active,.round:active{transform:scale(.97)}
.btn:focus-visible,.card:focus-visible,.opt:focus-visible,.chip:focus-visible,.round:focus-visible,.link:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.primary{background:var(--primary);color:var(--onp);box-shadow:var(--shadow)}
.secondary{background:var(--surface);color:var(--text);border-color:var(--border)}
.emergency{background:var(--emerg);color:#fff;box-shadow:0 2px 0 rgba(0,0,0,.14),0 6px 14px color-mix(in srgb,var(--emerg) 30%,transparent)}
.link{background:none;border:0;min-height:56px;padding:0 16px;font:500 20px var(--font);color:var(--text2);text-decoration:underline;text-underline-offset:4px;cursor:pointer;justify-self:center}
.link.sm{font-size:18px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.tile{width:56px;height:56px;border-radius:var(--r);background:color-mix(in srgb,var(--accent) 24%,var(--surface));color:var(--primary);display:grid;place-items:center;flex:none}
.tile.lg{width:96px;height:96px;border-radius:50%}
.tile.lg .ico{width:44px;height:44px}
.card{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;padding:18px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);font:400 20px/1.4 var(--font);cursor:pointer;transition:transform 120ms}
.card b{font:500 22px/1.3 var(--fh);display:block}
.card span{color:var(--text2)}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:64px;padding:12px 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);font:400 22px/1.3 var(--font);text-align:left;cursor:pointer;transition:transform 120ms}
.opt small{display:block;font-size:16px;color:var(--text2)}
.opt .rd{width:24px;height:24px;border-radius:50%;border:2px solid var(--border);flex:none;display:grid;place-items:center}
.opt[aria-checked=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.opt[aria-checked=true] .rd{border-color:var(--primary)}
.opt[aria-checked=true] .rd::after{content:"";width:12px;height:12px;border-radius:50%;background:var(--primary)}
.list{display:grid;gap:8px}
.field{display:grid;gap:6px}
.field label{font-weight:500}
input[type=text],input[type=password],input[type=tel],textarea{width:100%;height:64px;padding:0 16px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);font:400 20px var(--font)}
textarea{height:150px;padding:14px 16px;resize:none}
.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;display:grid;gap:12px}
.fillbox{background:var(--fill);border-radius:var(--r);padding:16px}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;background:var(--success);margin-right:8px}
.map{position:relative;height:170px;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;background:linear-gradient(90deg,transparent 30%,var(--border) 30% 33%,transparent 33% 68%,var(--border) 68% 71%,transparent 71%),linear-gradient(0deg,transparent 40%,var(--border) 40% 44%,transparent 44%),color-mix(in srgb,var(--accent) 12%,var(--surface));display:grid;place-items:center}
.map .tile{background:var(--primary);color:var(--onp);border-radius:50%}
.map p{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--border);padding:12px;font-size:16px;font-weight:500;text-align:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px;text-align:center}
.band{flex:none;background:var(--fill);padding:28px 16px 16px;border-radius:0 0 var(--r) var(--r);display:grid;gap:12px}
.status{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 16px;font-size:18px;line-height:1.4}
.talkcard{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%;padding:24px 16px;border-radius:var(--r);border:0;background:var(--primary);color:var(--onp);box-shadow:var(--shadow);text-align:center;cursor:pointer;transition:transform 120ms;font:400 20px/1.35 var(--font)}
.talkcard:active{transform:scale(.97)}
.talkcard:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.talkcard .mk{width:72px;height:72px;border-radius:50%;background:rgba(255,255,255,.18);display:grid;place-items:center}
.talkcard .mk .ico{width:36px;height:36px}
.talkcard b{font:500 26px/1.25 var(--fh)}
.stack{flex-direction:column;gap:8px;min-height:104px;padding:12px;font-size:20px}
.stack .ico{width:30px;height:30px;color:var(--primary)}
.links{display:flex;justify-content:center;gap:12px;margin-top:auto}
.sos{border-top:1px solid var(--border);background:var(--surface);padding:12px 16px 20px}
.sos .btn{min-height:72px;font-size:24px}
.bubble{max-width:84%;padding:12px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border)}
.bubble.me{align-self:flex-end;background:var(--primary);color:var(--onp);border-color:var(--primary)}
.chat{flex:1;overflow:auto;padding:4px 16px;display:flex;flex-direction:column;gap:10px}
.dock{flex:none;padding:8px 16px 16px;display:grid;gap:10px}
.say{display:grid;grid-template-columns:1fr 56px;gap:8px}
.say input{height:56px}
.round{border-radius:50%;border:1px solid var(--border);background:var(--surface);color:var(--text);display:grid;place-items:center;cursor:pointer;transition:transform 120ms}
.mic{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;justify-items:center}
.mic .round.cam{width:64px;height:64px}
.mic .round.big{width:88px;height:88px;background:var(--primary);color:var(--onp);border-color:var(--primary);box-shadow:var(--shadow)}
.mic .round.big .ico{width:36px;height:36px}
.mic .round.big.on{background:var(--success);border-color:var(--success)}
.chips{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.chip{min-height:56px;padding:4px 12px;border-radius:var(--r);border:1px solid var(--border);background:var(--surface);color:var(--text);font:500 18px/1.2 var(--font);cursor:pointer;transition:transform 120ms}
.chip[aria-pressed=true]{background:var(--primary);color:var(--onp);border-color:var(--primary)}
.group{background:var(--surface);border:1px solid var(--border);border-radius:var(--r)}
.row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:64px;padding:12px 16px}
.row+.row{border-top:1px solid var(--border)}
.row small{display:block;font-size:16px;color:var(--text2);line-height:1.35}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rc{font-style:normal;border:1px solid var(--border);background:var(--fill);border-radius:999px;padding:2px 12px;font-size:16px;color:var(--text)}
.sw{appearance:none;-webkit-appearance:none;flex:none;width:60px;height:36px;border-radius:18px;background:var(--border);position:relative;cursor:pointer;transition:background 200ms}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform 200ms}
.sw:checked{background:var(--success)}
.sw:checked::after{transform:translateX(24px)}
.sw:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.toast{position:absolute;left:16px;right:16px;bottom:110px;background:var(--text);color:var(--bg);border-radius:var(--r);padding:12px 16px;text-align:center;opacity:0;pointer-events:none;transition:opacity 200ms;z-index:5}
.toast.on{opacity:1}
.ok{color:var(--success);font-weight:500}
.jump{display:flex;gap:8px;align-items:center;color:#444;font:15px system-ui,sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

'நீங்கள் உதவி கேட்கும்போது மட்டுமே பகிரப்படும்',p3:'அறிவிப்புகள்',p3s:'சிம்ஹா தினமும் உங்களிடம் நலம் விசாரிக்கும்',p4:'பயன்பாட்டு அணுகல்',p4s:'நீங்கள் செயலில் இருப்பதை சிம்ஹா அறிய',medH:'உடல்நல விவரங்கள்',aiH:'AI மாதிரி',baseUrl:'அடிப்படை URL',apiKey:'API திறவுகோல்',modelL:'மாதிரி',test:'இணைப்பைச் சோதிக்கவும்',connOk:'இணைப்பு சரியாக உள்ளது',cgH:'கவனிப்பாளர்கள்',priya:'பிரியா',cgSub:'மகள் · உங்கள் நிலையையும் எச்சரிக்கைகளையும் பார்ப்பார்',remove:'நீக்கு',invite:'கவனிப்பாளரை அழைக்கவும்',toastRm:'பிரியா நீக்கப்பட்டார்',toastInv:'அழைப்புக் குறியீடு பகிரத் தயார்',simhaH:'சிம்ஹா',stop:'சிம்ஹாவை நிறுத்து',stopped:'சிம்ஹா நிறுத்தப்பட்டது',back:'பின்'}
};
const S={lang:'en',hosp:0,tm:2,wt:10,em:0,mic:false,path:'self',contacts:[],form:{role:'rF',pick:false}};
let H=['s1'];
const nm=()=>$('#name').value.trim()||'Kamala';
const t=(k,v={})=>{let s=(T[S.lang][k]??T.en[k]??k).replace('{n}',nm());for(const x in v)s=s.replace(`{${x}}`,v[x]);return s};
[1,2,3].forEach(i=>{const n=i+4,e=document.createElement('section');e.className='screen';e.id='s'+n;e.innerHTML=`<div class="body"><h1 data-k="m${i}h"></h1><p class="lead" data-k="m${i}l"></p><div class="field"><label for="f${n}" data-k="m${i}f"></label><textarea id="f${n}" data-ph="m${i}p"></textarea></div><p class="cap" data-k="medNote"></p></div><div class="foot"><button class="btn primary" data-go="s${n+1}" data-k="cont"></button><button class="btn secondary" data-go="s${n+1}" data-k="skip"></button></div>`;$('.stage').appendChild(e)});
function icons(r=document){r.querySelectorAll('i[data-i]').forEach(e=>{e.outerHTML=`<svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${ICONS[e.dataset.i]}</svg>`})}
icons();
$('#dots').innerHTML='<i></i>'.repeat(8);
function go(id,m='push'){
 if(m==='push')H.push(id);else if(m==='root')H=[id];
 $$('.screen').forEach(e=>e.classList.toggle('on',e.id===id));
 const n=parseInt(id.slice(1));
 $('#top').classList.toggle('off',id==='s10'||id==='s9');
 $('#back').style.visibility=H.length>1&&id!=='s9'?'visible':'hidden';
 $('#dots').style.visibility=n<=8?'visible':'hidden';
 $$('#dots i').forEach((d,i)=>{d.className=i+1<n?'d':i+1===n?'c':''});
 if(id==='s12'){S.em=0;stepRender();$('#dial').hidden=true}
 $('#jp').value=id;
}
function stepRender(){$('#stepN').textContent=t('stepOf',{a:S.em+1});$('#stepT').textContent=t('e'+(S.em+1));$('#next').hidden=S.em===2}
function toast(x){const e=$('#toast');e.textContent=x;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2000)}
function opts(el,items,sel,fn){el.innerHTML='';items.forEach(([k,l,s])=>{const b=document.createElement('button');b.className='opt';b.setAttribute('role','radio');b.setAttribute('aria-checked',String(k===sel));b.innerHTML=`<span>${l}${s?`<small>${s}</small>`:''}</span><span class="rd"></span>`;b.onclick=()=>fn(k);el.appendChild(b)})}
function renderLang(){['#langA','#langB'].forEach(s=>opts($(s),LANGS,S.lang,k=>{S.lang=k;apply()}))}
function renderHosp(){opts($('#hosp'),DIST.map((d,i)=>[i,t('h'+(i+1)),`${d} ${t('away')}`]),S.hosp,k=>{S.hosp=k;renderHosp()})}
function chips(el,vals,key,unit){el.innerHTML='';vals.forEach(v=>{const b=document.createElement('button');b.className='chip';b.textContent=`${v} ${t(unit)}`;b.setAttribute('aria-pressed',String(v===S[key]));b.onclick=()=>{S[key]=v;timing()};el.appendChild(b)})}
function timing(){chips($('#tm'),[1,2,3,4,6,8],'tm','hrS');chips($('#wt'),[5,10,15],'wt','minS');$('#tmNote').textContent=t('tmNote',{h:`${S.tm} ${t(S.tm===1?'hrW':'hrsW')}`,m:`${S.wt} ${t('minW')}`})}
function micCap(){$('#micCap').textContent=t(S.mic?'listening':'tapTalk')}
function renderSaved(){const g=$('#saved');g.innerHTML='';S.contacts.forEach(c=>{const r=document.createElement('div'),a=document.createElement('span'),m=document.createElement('small'),rc=document.createElement('em'),n=document.createElement('span');r.className='row';m.className='meta';rc.className='rc';rc.textContent=t(c.r);n.textContent=c.n;m.append(rc,n);a.append(document.createTextNode(c.l),m);r.appendChild(a);g.appendChild(r)});g.hidden=!S.contacts.length}
function apply(){
 document.documentElement.lang=S.lang;
 $('#nameQ').dataset.k=S.path==='self'?'nameQ1':'nameQ2';
 $('#lblWho').dataset.k=S.form.pick?'picked':S.form.title||'addF';
 $$('[data-k]').forEach(e=>e.textContent=t(e.dataset.k));
 $$('[data-ph]').forEach(e=>e.placeholder=t(e.dataset.ph));
 $$('[data-al]').forEach(e=>e.setAttribute('aria-label',t(e.dataset.al)));
 renderLang();renderHosp();timing();stepRender();micCap();renderSaved();
}
$('#jp').innerHTML=NAMES.map((n,i)=>`<option value="s${i+1}">${i+1}. ${n}</option>`).join('');
$('#jp').onchange=e=>go(e.target.value);
$$('.themes button').forEach(b=>b.onclick=()=>{$('#phone').dataset.theme=b.dataset.t;$$('.themes button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)))});
$('#back').onclick=()=>{H.pop();go(H[H.length-1],'none')};
$('#name').oninput=apply;
document.addEventListener('click',e=>{
 const p=e.target.closest('[data-path]');
 if(p){S.path=p.dataset.path;apply();go('s2');return}
 const a=e.target.closest('[data-add]'),k=e.target.closest('[data-pick]');
 if(a||k){const b=a||k;S.form=a?{role:a.dataset.add,pick:false,title:a.dataset.title}:{role:'rC',pick:true};$('#lbl').value='';$('#ph').value='';$('#phF').hidden=S.form.pick;$('#pickInfo').hidden=!S.form.pick;b.after($('#lblBox'));$('#lblBox').hidden=false;apply();$('#lblBox').scrollIntoView({block:'nearest'});return}
 const h=e.target.closest('[data-home]');
 if(h){if(h.dataset.msg)toast(t(h.dataset.msg));go('s9','root');return}
 const x=e.target.closest('[data-toast]');
 if(x){toast(t(x.dataset.toast));return}
 const g=e.target.closest('[data-go]');
 if(g)go(g.dataset.go);
});
$('#lblSave').onclick=()=>{const f=S.form;S.contacts.push({l:$('#lbl').value.trim()||t(f.role),r:f.role,n:f.pick?'+91 98765 43210':$('#ph').value.trim()});renderSaved();$('#lblBox').hidden=true};
$('#mic').onclick=()=>{S.mic=!S.mic;$('#mic').classList.toggle('on',S.mic);micCap()};
$('#next').onclick=()=>{if(S.em<2){S.em++;stepRender()}};
$('#c112').onclick=()=>{$('#dial').hidden=false};
$('#test').onclick=()=>{$('#testR').hidden=false};
apply();
go('s1','root');
</script>
